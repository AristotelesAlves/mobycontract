name: mobycontract-global

x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-ambiente-local: &ambiente-local
  PSEUDONIMO_SALT: "salt-local-de-desenvolvimento-nao-usar-em-producao"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      registry:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/storage/app/public:/var/www/html/storage/app/public:ro
    networks:
      - rede-borda
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 128M
    logging: *log

  api:
    build:
      context: ./app
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    image: mobycontract/api:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
      BLOCKCHAIN_REGISTRY_URL: http://registry:4000
    volumes:
      - ./app:/var/www/html:delegated
      - arquivos:/var/www/html/storage/app
    tmpfs:
      - /tmp
    networks:
      - rede-borda
      - rede-dados
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    mem_limit: 768M
    logging: *log

  queue:
    image: mobycontract/api:local
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
    command:
      - php
      - artisan
      - queue:work
      - --queue=api,default
      - --sleep=1
      - --tries=3
      - --backoff=10
      - --max-time=3600
      - --max-jobs=1000
    volumes:
      - ./app:/var/www/html:delegated
      - arquivos:/var/www/html/storage/app
    tmpfs:
      - /tmp
    networks:
      - rede-borda
      - rede-dados
    mem_limit: 512M
    logging: *log

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_BASE_URI_API: http://localhost:8000/api/v1
    image: mobycontract/web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      BASE_URI_API: http://nginx/api/v1
      NEXT_PUBLIC_BASE_URI_API: http://localhost:8000/api/v1
      NEXT_PUBLIC_BLOCKCHAIN_URL: http://localhost:8000/blockchain
    networks:
      - rede-borda
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    logging: *log

  anvil:
    build:
      context: ./blockchain
      dockerfile: Dockerfile.anvil
    restart: unless-stopped
    user: "0:0"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --accounts
      - "20"
      - --balance
      - "10000"
      - --block-base-fee-per-gas
      - "0"
      - --gas-limit
      - "30000000"
      - --auto-impersonate
      - --steps-tracing
      - --state
      - /anvil
      - --state-interval
      - "15"
    volumes:
      - estado-anvil:/anvil
    networks:
      - rede-borda
      - rede-blockchain
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 512M
    logging: *log

  deploy:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
      target: build
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      <<: *ambiente-local
      HARDHAT_NETWORK: localhost
      RPC_URL: "http://anvil:8545"
      CHAIN_ID_ESPERADO: "31337"
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    volumes:
      - deployments:/app/deployments
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    restart: "no"
    networks:
      - rede-blockchain
    mem_limit: 1G
    logging: *log

  blockchain-test:
    profiles: ["test"]
    build:
      context: ./blockchain
      dockerfile: Dockerfile
      target: build
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      <<: *ambiente-local
      HARDHAT_NETWORK: hardhat
      TEST_DB_HOST: db
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: mobycontract_teste
    command: ["npm", "test"]
    restart: "no"
    networks:
      - rede-dados
    mem_limit: 1G
    logging: *log

  registry:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      deploy:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      <<: *ambiente-local
      RPC_URL: "http://anvil:8545"
      CHAIN_ID_ESPERADO: "31337"
      NOME_CHAIN: "anvil-local"
      CHAVE_PRIVADA: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      CHAVE_API: "chave-local-de-desenvolvimento"
      ADMIN_USUARIO: "admin"
      ADMIN_SENHA: "admin-local-de-desenvolvimento"
      JWT_SECRETO: "segredo-jwt-local-de-desenvolvimento-nao-usar-em-producao"
      CAMINHO_BANCO: "/app/data/mobycontract.db"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "mobycontract"
      DB_USER: "mobycontract"
      PORT: "4000"
      LOG_LEVEL: info
    volumes:
      - deployments:/app/deployments:ro
      - dados-blockchain:/app/data
    networks:
      - rede-borda
      - rede-blockchain
      - rede-dados
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/saude').then(r=>r.json()).then(s=>process.exit(s.status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512M
    logging: *log

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./app/.env
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/var/lib/postgresql/data/pg_hba.conf
      - -c
      - ident_file=/var/lib/postgresql/data/pg_ident.conf
    volumes:
      - ./app/infra/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./app/infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - dados-postgres:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1G
    logging: *log

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320M
    logging: *log

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - dados-fila:/data
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 640M
    logging: *log

volumes:
  arquivos:
  dados-postgres:
  dados-fila:
  deployments:
  dados-blockchain:
  estado-anvil:

networks:
  rede-borda:
  rede-dados:
    internal: true
  rede-blockchain:
    internal: true
