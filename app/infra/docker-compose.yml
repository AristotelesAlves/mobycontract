name: mobycontract

x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rede-borda
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 128M
    logging: *log

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    image: mobycontract/api:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
    volumes:
      - ..:/var/www/html:delegated
      - arquivos:/var/www/html/storage/app
    tmpfs:
      - /tmp
    networks:
      - rede-borda
      - rede-dados
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    mem_limit: 768M
    logging: *log

  queue:
    image: mobycontract/api:local
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
    command:
      - php
      - artisan
      - queue:work
      - --queue=api,default
      - --sleep=1
      - --tries=3
      - --backoff=10
      - --max-time=3600
      - --max-jobs=1000
    volumes:
      - ..:/var/www/html:delegated
      - arquivos:/var/www/html/storage/app
    tmpfs:
      - /tmp
    networks:
      - rede-borda
      - rede-dados
    mem_limit: 512M
    logging: *log

  cli:
    profiles: ["ferramentas"]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: desenvolvimento
    image: mobycontract/api:desenvolvimento
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
    volumes:
      - ..:/var/www/html:delegated
      - arquivos:/var/www/html/storage/app
    working_dir: /var/www/html
    tmpfs:
      - /tmp
    networks:
      - rede-borda
      - rede-dados
    mem_limit: 1G
    logging: *log

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/var/lib/postgresql/data/pg_hba.conf
      - -c
      - ident_file=/var/lib/postgresql/data/pg_ident.conf
    volumes:
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - dados-postgres:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1G
    logging: *log

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320M
    logging: *log

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - dados-fila:/data
    networks:
      - rede-dados
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 640M
    logging: *log

volumes:
  arquivos:
  dados-postgres:
  dados-fila:

networks:
  rede-borda:
  rede-dados:
    internal: true