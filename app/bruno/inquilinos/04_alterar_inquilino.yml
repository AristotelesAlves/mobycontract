info:
  name: Alterar Inquilino
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/inquilinos/{{id}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "nome": "Carlos Eduardo Teste",
        "email": "carlos.bruno8yz1@email.com",
        "telefone": "11988888888"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
