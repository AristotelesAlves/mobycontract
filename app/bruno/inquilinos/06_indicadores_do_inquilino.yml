info:
  name: Indicadores do Inquilino
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/inquilinos/{{id}}/indicadores"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
