info:
  name: Alterar Lead
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/leads/{{id}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "nome": "Lead Bruno atualizado",
        "observacoes": "Procurando apartamento 2 ou 3 quartos"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
