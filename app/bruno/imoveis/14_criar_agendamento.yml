info:
  name: Criar Agendamento
  type: http
  seq: 14

http:
  method: POST
  url: "{{base_url}}/imoveis/{{imovelId}}/agendamentos"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "data": "2026-11-01",
        "hora": "14:00",
        "interessado": "João Silva",
        "telefone": "(11) 99999-9999"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
