info:
  name: Excluir Imovel
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/imoveis/{{imovelId}}"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
