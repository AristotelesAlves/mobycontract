info:
  name: Excluir Anotacao
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{base_url}}/imoveis/{{imovelId}}/anotacoes/{{anotacaoId}}"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
