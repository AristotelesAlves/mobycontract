info:
  name: Alterar Status do Agendamento
  type: http
  seq: 15

http:
  method: PUT
  url: "{{base_url}}/imoveis/{{imovelId}}/agendamentos/{{agendamentoId}}/status"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "status": "Realizado"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
