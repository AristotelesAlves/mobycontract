info:
  name: Criar Interessado
  type: http
  seq: 17

http:
  method: POST
  url: "{{base_url}}/imoveis/{{imovelId}}/interessados"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "nome": "Maria Souza",
        "telefone": "(11) 98888-8888",
        "email": "maria.souza.xz1@email.com",
        "tipo": "Alugar",
        "status": "Novo"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
