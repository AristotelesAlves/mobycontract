info:
  name: Consultar CEP
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/imoveis/enderecos/{{cep}}"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
