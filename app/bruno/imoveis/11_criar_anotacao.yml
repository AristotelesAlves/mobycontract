info:
  name: Criar Anotacao
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/imoveis/{{imovelId}}/anotacoes"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "texto": "Nova anotação de teste"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
