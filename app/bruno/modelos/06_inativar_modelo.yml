info:
  name: Inativar Modelo
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/modelos/{{id}}/inativar"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
