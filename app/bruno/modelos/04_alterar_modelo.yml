info:
  name: Alterar Modelo
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/modelos/{{id}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "garantia": "Sem garantia"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
