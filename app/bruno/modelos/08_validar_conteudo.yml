info:
  name: Validar Conteudo
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/modelos/validar-conteudo"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "conteudoHtml": "<p>Cliente {{ cliente.nome }} conforme</p>"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
