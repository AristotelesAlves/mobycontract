info:
  name: Confirmar Documento Fisico
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}/contratos/{{contratoId}}/documento-fisico"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
