info:
  name: Registrar Pagamento
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/contratos/{{contratoId}}/parcelas/{{parcelaId}}/pagamento"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "dataPagamento": "2026-12-05",
        "valorPago": 2400
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
