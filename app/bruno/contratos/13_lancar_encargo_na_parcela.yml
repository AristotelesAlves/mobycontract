info:
  name: Lancar Encargo na Parcela
  type: http
  seq: 13

http:
  method: POST
  url: "{{base_url}}/contratos/{{contratoId}}/parcelas/{{parcelaId}}/encargos"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "tipo": "multa",
        "valor": 50,
        "motivo": "Atraso no pagamento"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
