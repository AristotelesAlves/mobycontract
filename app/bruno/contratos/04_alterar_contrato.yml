info:
  name: Alterar Contrato
  type: http
  seq: 4

http:
  method: PUT
  url: "{{base_url}}/contratos/{{contratoId}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "descontoMensal": 0,
        "multaPorAtraso": 10,
        "observacoes": "Contrato atualizado via Bruno"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
