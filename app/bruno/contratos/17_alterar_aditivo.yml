info:
  name: Alterar Aditivo
  type: http
  seq: 17

http:
  method: PUT
  url: "{{base_url}}/contratos/{{contratoId}}/aditivos/{{aditivoId}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "titulo": "Aditivo Atualizado",
        "descricao": "Descricao atualizada"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
