info:
  name: Sair
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{base_url}}/usuarios/sessao"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
