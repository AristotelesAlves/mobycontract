info:
  name: Login - Entrar
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/usuarios/sessao/entrar"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "email":"admin@mobycontract.com",
        "senha":"senha1234"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (res.getStatus() === 200) {
          bru.setEnvVar("token", response.dados.access_token);
          console.log("Token salvo com sucesso!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
