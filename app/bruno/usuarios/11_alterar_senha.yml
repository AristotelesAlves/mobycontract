info:
  name: Alterar Senha
  type: http
  seq: 11

http:
  method: PUT
  url: "{{base_url}}/usuarios/{{id}}/senha"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "novaSenha": "NovaSenha123@"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
