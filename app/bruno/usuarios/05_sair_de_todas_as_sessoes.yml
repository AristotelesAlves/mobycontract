info:
  name: Sair de Todas as Sessoes
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{base_url}}/usuarios/sessao/todas"
  auth: inherit
  headers:
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
