info:
  name: Alterar Usuario
  type: http
  seq: 10

http:
  method: PUT
  url: "{{base_url}}/usuarios/{{id}}"
  auth: inherit
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json"
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: application/json
    raw: |
      {
        "nome": "Administrador",
        "papel": "Administrador",
        "ativo": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
