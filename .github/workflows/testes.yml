name: testes

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blockchain:
    name: blockchain (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d registry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    defaults:
      run:
        working-directory: blockchain

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_NAME: registry_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: blockchain/package-lock.json

      - name: instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: compilar contratos
        run: npm run compile

      - name: verificar tipos
        run: npm run typecheck

      # Os testes sobem o proprio no EVM em porta efemeraria, entao nao ha
      # servico externo para esperar: nenhum passo precisa de Polygon Amoy nem
      # de chave de verdade. A rede em teste e sempre o chainId 31337 local.
      - name: rodar testes
        run: npm test
