user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 26M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        server api:9000 resolve;
        keepalive 32;
    }

    upstream web_backend {
        zone web_backend 64k;
        server web:3000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location /up {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api {
            include fastcgi_params;
            fastcgi_pass api_backend;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param PATH_INFO "";
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # O Registry e suas rotas administrativas são internos. Laravel fala
        # com ele pela rede Docker; nunca os publique pela borda HTTP.
        location ^~ /blockchain/ { return 404; }

        location /storage {
            alias /var/www/html/storage/app/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
